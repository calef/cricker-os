[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Typed wrappers over aarch64 system registers, so we write
# `SCTLR_EL1.modify(SCTLR_EL1::M::Enable)` instead of hand-rolling `msr` and getting
# a bit position wrong. DECISIONS.md §3.
aarch64-cpu = "11"
abi = { version = "0.1.0", path = "../crates/abi" }
asid = { version = "0.1.0", path = "../crates/asid" }
caps = { version = "0.1.0", path = "../crates/caps" }
# The compositor contract (milestone 33): the kernel wires the scene and its tests predict the
# composed screen from the same definition the compositor and its clients paint from.
compose = { version = "0.1.0", path = "../crates/compose" }
coremark = { version = "0.1.0", path = "../crates/coremark" }
crickerfs = { version = "0.1.0", path = "../crates/crickerfs" }
dma_validate = { version = "0.1.0", path = "../crates/dma_validate" }
fs_proto = { version = "0.1.0", path = "../crates/fs_proto" }
gfx_proto = { version = "0.1.0", path = "../crates/gfx_proto" }
dtb = { version = "0.1.0", path = "../crates/dtb" }
pci = { version = "0.1.0", path = "../crates/pci" }
elf = { version = "0.1.0", path = "../crates/elf" }
frames = { version = "0.1.0", path = "../crates/frames" }
intrusive = { version = "0.1.0", path = "../crates/intrusive" }
ipc = { version = "0.1.0", path = "../crates/ipc" }
measure = { version = "0.1.0", path = "../crates/measure" }
paging = { version = "0.1.0", path = "../crates/paging" }
regions = { version = "0.1.0", path = "../crates/regions" }
slots = { version = "0.1.0", path = "../crates/slots" }
spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }

# Typed, compile-time-checked MMIO register blocks. An off-by-four in a device's
# register layout becomes a build error instead of a mystery at runtime.
tock-registers = "0.10"

[build-dependencies]
# The measured-boot digest parser, shared with the kernel proper so the manifest the build writes and
# the trust root the kernel checks have exactly one definition of the format (milestone 22 phase B.1).
measure = { version = "0.1.0", path = "../crates/measure" }

[features]
# The benchmark boot (milestone 21): run the microbenchmarks and halt. See script/bench.
bench = []
# The init boot (milestone 19d.2c): userspace init is the boot path and brings up the system's
# console, rather than the kernel wiring services directly. See script/initboot / xtask.
initboot = []
# Boot straight to the interactive shell, skipping the milestone tour. Used by cargo xtask shell.
shell = []
# Adds a test that deliberately livelocks while making IPC progress, to prove the per-test wall-clock
# ceiling catches what the no-progress heartbeat cannot see (testing.rs). It is EXPECTED TO FAIL the
# run, so it is not part of the normal suite; see notes/scheduler.md for the command that runs it.
watchdog_probe = []
