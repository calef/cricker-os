[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
# Typed wrappers over aarch64 system registers, so we write
# `SCTLR_EL1.modify(SCTLR_EL1::M::Enable)` instead of hand-rolling `msr` and getting
# a bit position wrong. DECISIONS §3.
aarch64-cpu = "11"
abi = { version = "0.1.0", path = "../crates/abi" }
asid = { version = "0.1.0", path = "../crates/asid" }
# The bitmap font and the VT engine (milestone 29's text increment). The kernel does not draw
# anything; it *predicts*. Its display-terminal tests run the same engine over the same script the
# terminal was sent and compare the framebuffer pixel for pixel, so no process grades its own
# homework and the picture is a value rather than a screenshot somebody eyeballed once.
bitfont = { version = "0.1.0", path = "../crates/bitfont" }
# The calendar (milestone 51). The kernel does no date arithmetic of its own; its `date` tests
# *parse back* what the command printed and compare the instant it names against the wall clock the
# kernel computes straight from the clock page. Same discipline as bitfont/vt above: the test
# predicts from the shared definition rather than keeping a second copy of it.
calendar = { version = "0.1.0", path = "../crates/calendar" }
capability = { version = "0.1.0", path = "../crates/capability" }
# The shell's grant-expression logic (milestone 47's `rm -r`). The kernel plans nothing; its `rm`
# test **starts the program the way the shell would**, so the option bits it packs come from the
# manifest the prompt checks against rather than from a second copy of an ordering. Same rule as
# `line_editor`, `bitfont` and `calendar` below: no party has its own copy of a shared definition.
grant_plan = { version = "0.1.0", path = "../crates/grant_plan" }
# The wall-clock contract (milestone 51, DECISIONS §43). The kernel discovers the RTC by
# `compatible` and names the binding with these constants, and its clock tests read the shared page
# through the same seqlock the service publishes with, so no party has its own copy of the layout.
clock_proto = { version = "0.1.0", path = "../crates/clock_proto" }
# The block-device roster (milestone 57). The kernel writes the page and the surveyor reads it, and
# the kernel's own tests read it back through this crate rather than by trusting the count the
# program sent home, so no party has its own copy of the layout.
block_roster = { version = "0.1.0", path = "../crates/block_roster" }
# The compositor contract (milestone 33): the kernel wires the scene and its tests predict the
# composed screen from the same definition the compositor and its clients paint from.
compositor = { version = "0.1.0", path = "../crates/compositor" }
# The credential contract (milestone 56, the credential half). The kernel wires the credential
# service and its provisioner, and its tests read the reply codes the userspace clients report, so
# no party has its own copy of what a verdict means.
cred_proto = { version = "0.1.0", path = "../crates/cred_proto" }
coremark = { version = "0.1.0", path = "../crates/coremark" }
crickerfs = { version = "0.1.0", path = "../crates/crickerfs" }
dma_validator = { version = "0.1.0", path = "../crates/dma_validator" }
fs_proto = { version = "0.1.0", path = "../crates/fs_proto" }
gfx_proto = { version = "0.1.0", path = "../crates/gfx_proto" }
# The entropy contract (milestone 56, DECISIONS §44). The kernel wires the entropy service and its
# tests are its clients, speaking the same request/reply the std PAL does, so no party has its own
# copy of the wire format.
entropy_proto = { version = "0.1.0", path = "../crates/entropy_proto" }
dtb = { version = "0.1.0", path = "../crates/dtb" }
pci = { version = "0.1.0", path = "../crates/pci" }
elf = { version = "0.1.0", path = "../crates/elf" }
frames = { version = "0.1.0", path = "../crates/frames" }
intrusive = { version = "0.1.0", path = "../crates/intrusive" }
ipc = { version = "0.1.0", path = "../crates/ipc" }
# What machine is this (milestone 60). The kernel reads the device tree and the ID registers; every
# decoding of what it finds lives in the crate, host-tested against a real device tree and against
# words a real part reports, because a parser proved only inside a booting kernel is a parser proved
# by nothing that runs in milliseconds.
isa = { version = "0.1.0", path = "../crates/isa" }
# The terminal contract's IPC framing (DECISIONS §21): the kernel's display-terminal tests play both
# an application (OP_WRITE) and an input driver (OP_BYTES), so they speak the same protocol the
# serial terminal's clients and drivers do rather than a second one invented for a test.
line_editor = { version = "0.1.0", path = "../crates/line_editor" }
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }
# The NTPv4 wire format (milestone 51). The kernel's NTP tests read the request the client actually
# put on the wire, so the version, mode and port they assert on come from the same definition the
# client serialised from rather than from three copies of RFC 5905 §7.3.
ntp_proto = { version = "0.1.0", path = "../crates/ntp_proto" }
paging = { version = "0.1.0", path = "../crates/paging" }
regions = { version = "0.1.0", path = "../crates/regions" }
# The byte-sink contract (milestone 50). The kernel's tests are a *sink* for every std program they
# spawn, so the framing they decode comes from the same definition the PAL packs with rather than
# from a second copy of it in a test helper, which is what it was before this milestone.
sink_proto = { version = "0.1.0", path = "../crates/sink_proto" }
slots = { version = "0.1.0", path = "../crates/slots" }
spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }
video_terminal = { version = "0.1.0", path = "../crates/video_terminal" }

# Typed, compile-time-checked MMIO register blocks. An off-by-four in a device's
# register layout becomes a build error instead of a mystery at runtime.
tock-registers = "0.10"

[build-dependencies]
# The measured-boot digest parser, shared with the kernel proper so the manifest the build writes and
# the trust root the kernel checks have exactly one definition of the format (milestone 22 phase B.1).
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }

[features]
# The benchmark boot (milestone 21): run the microbenchmarks and halt. See script/bench.
bench = []
# The init boot (milestone 19d.2c): userspace init is the boot path and brings up the system's
# console, rather than the kernel wiring services directly. See script/initboot / xtask.
initboot = []
# Boot straight to the interactive shell, skipping the milestone tour. Used by cargo xtask shell.
shell = []
# Adds a test that deliberately livelocks while making IPC progress, to prove the per-test wall-clock
# ceiling catches what the no-progress heartbeat cannot see (testing.rs). It is EXPECTED TO FAIL the
# run, so it is not part of the normal suite; see notes/scheduler.md for the command that runs it.
watchdog_probe = []
