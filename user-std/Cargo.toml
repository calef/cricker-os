# The std demo workload (milestone 27): ordinary Rust, no attributes, no `no_std`, built for the
# `*-unknown-cricker` custom targets with `-Zbuild-std` against the patched rust-src that carries
# the cricker PAL (patches/std-cricker; `cargo xtask std-src`).
#
# Deliberately NOT a member of the main workspace: it builds under the linked `cricker-dev`
# toolchain with build-std flags the workspace crates must never inherit, and its target dir is
# its own. `cargo xtask user-std` is the front door.

[package]
name = "hellostd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

# The kernel's ELF loader maps whole pages per segment and the initrd carries the file; keep the
# binary small and the build deterministic.
[profile.release]
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"
