[package]
name = "user"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "hello"
path = "src/hello.rs"
# This is a bare-metal `no_std` binary with no unit tests, and the default test/bench targets link
# libtest (`extern crate test`), which does not exist for the aarch64-unknown-none target. Turning
# them off is what lets `cargo clippy --all-targets` (and any --all-targets build) work here instead
# of failing to find crate `test`. The kernel keeps its test target because it supplies its own
# harness via `custom_test_frameworks`.
test = false
bench = false

# The worker (milestone 19f.2): the first program that is its own binary, not a role of `hello`.
# It shares this package's `build.rs` link.ld (linked at 0x40_0000) but no code. Same test/bench
# reasoning as above. `mkinitrd` packs it into the archive under the name "worker".
[[bin]]
name = "worker"
path = "src/worker.rs"
test = false
bench = false

# The console server (milestone 19f.3): the second program lifted out of `hello`. `mkinitrd` packs
# it under "console"; init loads it by name.
[[bin]]
name = "console"
path = "src/console.rs"
test = false
bench = false

# The input driver (milestone 19f.4): the receive half of the terminal, lifted out of hello.
# Since milestone 28 it is a raw byte forwarder; the editing lives in line_editor.
[[bin]]
name = "input"
path = "src/input.rs"
test = false
bench = false

# The line discipline (milestone 28): the tty layer as a swappable userspace component between
# the input/console drivers and applications. Serves the terminal contract
# (notes/terminal-contract.md); the editing engine is the host-tested `line_editor` crate.
[[bin]]
name = "line_editor"
path = "src/line_editor.rs"
test = false
bench = false

# `swish` (milestone 19f.5): the shell, the last program lifted out of hello, and the most wired.
# A swish is the shot that goes through the net touching nothing, which is least authority in one
# word. `mkinitrd` packs it as "swish"; `system_initializer` loads it by that name.
[[bin]]
name = "swish"
path = "src/swish.rs"
test = false
bench = false

# The budgeter (milestone 31): spends exactly the untyped budget `run --mem N` grants it and reports
# how many pages it could map. The program that makes the memory grant real, not parsed-and-ignored.
[[bin]]
name = "budgeter"
path = "src/budgeter.rs"
test = false
bench = false

# The heeder (milestone 24): a long-running job that heeds the cooperative ^C, polling a shared flag
# between work units and exiting cleanly when the shell sets it. The cooperative interrupt tier.
[[bin]]
name = "heeder"
path = "src/heeder.rs"
test = false
bench = false

# The spinner (milestone 24): a runaway that ignores the interrupt; only the forcible tier (the shell
# tearing its region down) ends it. The case the second ^C exists for.
[[bin]]
name = "spinner"
path = "src/spinner.rs"
test = false
bench = false

# The outlaw (milestone 19, the user-test port): reads an address it is not allowed to touch, and
# round-trips through user mode. The two programs kernel::user::tests used to hand-assemble as
# aarch64 machine code; a real ELF here is what lets those tests run on both ISAs.
[[bin]]
name = "outlaw"
path = "src/outlaw.rs"
test = false
bench = false

# The CoreMark workload (milestone 19e): the first real compute workload, run against the native ABI.
[[bin]]
name = "coremark"
path = "src/coremark.rs"
test = false
bench = false

# The minimal init / system builder (milestone 20): a fully portable init that loads the worker from
# a multi-entry initrd archive and builds it as a child through the capability verbs. It is the
# RISC-V richer-initrd demonstration (the aarch64 init is a role of the PL011-wired `hello`). Same
# test/bench reasoning as the others; the riscv initrd packs it under the name "init".
[[bin]]
name = "builder"
path = "src/builder.rs"
test = false
bench = false

# The interrupt-driven console input driver (milestone 20): an unprivileged userspace device driver.
# It holds an Irq capability, a report endpoint, and a device mapping of the UART, and services the
# receive interrupt with the seL4 WAIT/read/report/ACK loop. Portable; the riscv initrd packs it as
# "driver". The aarch64 input driver is the PL011-wired role of `hello`; this is its portable analog.
[[bin]]
name = "driver"
path = "src/driver.rs"
test = false
bench = false

# The system builder / boot init (parity D): the portable counterpart of hello's init_boot role. It
# builds the interactive system (console + input + shell) out of its own budget and stays as the
# spawn service. The riscv boot loads it as the boot process; aarch64 keeps using hello's init_boot.
[[bin]]
name = "system_initializer"
path = "src/system_initializer.rs"
test = false
bench = false

# The virtio-blk driver as its own binary (parity C): the shared `virtio` module (the same file
# hello's aarch64 roles compile) behind a dedicated-binary skeleton, so riscv runs the identical
# driver, attacker included, without porting the PL011-wired hello multiplexer.
[[bin]]
name = "blk"
path = "src/blk.rs"
test = false
bench = false

# The allocator workload (milestone 27): the first program that links `extern crate alloc`, over
# the untyped-backed heap in user_rt. Proves Vec/String/BTreeMap churn, free-in-any-order, and
# reuse-without-growth against a real budget, on both ISAs.
[[bin]]
name = "allocator_exerciser"
path = "src/allocator_exerciser.rs"
test = false
bench = false

# The FS-service client (milestone 32 phase 2): opens a file through a granted directory capability,
# reads it, writes and reads back a pattern, and reports. mkinitrd packs it as "fs_test_client".
[[bin]]
name = "fs_test_client"
path = "src/fs_test_client.rs"
test = false
bench = false

# The file caretaker (milestone 31 phase 2): a directory capability attenuated to one file, in one
# direction. It is the caretaker that stands between the FS server and a program the command line
# granted a single file, and it is a separate process so the narrowing is an address-space boundary
# rather than a branch. mkinitrd packs it as "fs_file_caretaker".
[[bin]]
name = "fs_file_caretaker"
path = "src/fs_file_caretaker.rs"
test = false
bench = false

# The subtree caretaker (milestone 47): the same caretaker one rung up, narrowing a directory
# capability to one SUBTREE with an explicit rights ladder. It is what `cd` and a per-process
# namespace resolve to, and it is a separate process for fs_file_caretaker's reason: the FS
# server's handle table is per server, so only an address-space boundary keeps a program off the
# parent directory. mkinitrd packs it as "fs_subtree_caretaker".
[[bin]]
name = "fs_subtree_caretaker"
path = "src/fs_subtree_caretaker.rs"
test = false
bench = false

# The nameset caretaker (milestone 47's globbing lane): the same caretaker over a namespace of the
# names a pattern matched. A third caretaker rather than a mode on `fs_subtree_caretaker`, because
# that program's design property is that it performs no checks at all, and a name filter is a check
# on every name-taking verb. mkinitrd packs it as "fs_nameset_caretaker".
[[bin]]
name = "fs_nameset_caretaker"
path = "src/fs_nameset_caretaker.rs"
test = false
bench = false

# The EL0 microbenchmark program (primitive suite): self-times syscall/IPC primitives from EL0, the
# lmbench way, so the numbers include the trap the kernel-side benchmarks skip. Run by the bench boot.
[[bin]]
name = "os_primitives_benchmarker"
path = "src/os_primitives_benchmarker.rs"
test = false
bench = false

# The authority-shrinking supervision tree (milestone 22 phase B.2). Four programs, one shared module
# (src/suptree.rs): `root_supervisor` is an init that hands its construction authority to `spawner` and its
# restart policy to `sub_server_supervisor` and then DELETES its budget; `flaky` is the supervised sub-server that
# crashes once so the tree has something real to keep alive. Portable, both ISAs; the kernel's
# authority_tests drive them.
[[bin]]
name = "root_supervisor"
path = "src/root_supervisor.rs"
test = false
bench = false

[[bin]]
name = "spawner"
path = "src/spawner.rs"
test = false
bench = false

[[bin]]
name = "sub_server_supervisor"
path = "src/sub_server_supervisor.rs"
test = false
bench = false

[[bin]]
name = "flaky"
path = "src/flaky.rs"
test = false
bench = false

# The interactive boot's corpse collector (milestone 22, the interactive increment). Holds one
# endpoint capability with READ and nothing else; init endows every job it builds with the same
# endpoint, and the pages come back to init's budget when this collects the corpse.
[[bin]]
name = "job_reaper"
path = "src/job_reaper.rs"
test = false
bench = false

# The C seam (milestone 36). Three files, two binaries: `c_shim` is the Rust user_rt shell that
# links user/c/c_seam.c (compiled by build.rs with a bare-metal clang) and holds every capability
# the foreign component is not allowed to see; `c_confiner` builds it, supervises it, and holds the
# witness pages that prove what the C could not reach. Both portable; both archives carry both.
[[bin]]
name = "c_shim"
path = "src/c_shim.rs"
test = false
bench = false

[[bin]]
name = "c_confiner"
path = "src/c_confiner.rs"
test = false
bench = false

# The net server (milestone 30, piece 3): smoltcp as a userspace TCP/IP stack driving the confined
# NIC. Links `extern crate alloc` over user_rt's heap. `mkinitrd` packs it as "net_stack" for both ISAs.
[[bin]]
name = "net_stack"
path = "src/net_stack.rs"
test = false
bench = false

# The display driver (milestone 29, the display ladder's rung one): drives the virtio-gpu device
# over the confined transport and serves the framebuffer contract to clients. `mkinitrd` packs it as
# "display" for both ISAs.
[[bin]]
name = "display"
path = "src/display.rs"
test = false
bench = false

# The client that draws (milestone 29): paints a coordinate-derived pattern into a shared surface and
# asks the driver to show it. Holds an endpoint and the pixels; no device, no DMA authority. The
# separation is the increment's point, so it is its own binary rather than a role of display.
[[bin]]
name = "painter"
path = "src/painter.rs"
test = false
bench = false

# The compositor (milestone 33, rung two): multiplexes one screen among mutually distrusting clients.
# It is rung one's client at the display seam (display cannot tell it from `painter`), and it holds one
# doorbell endpoint for all its clients plus one input endpoint per focusable client. `mkinitrd` packs
# it as "compositor" for both ISAs.
[[bin]]
name = "compositor"
path = "src/compositor.rs"
test = false
bench = false

# A window: a client of the compositor (milestone 33). One binary, several roles, because an attacker
# that shares the honest path is a fair test of the boundary rather than a different program failing
# for its own reasons. Packed as "window".
[[bin]]
name = "window"
path = "src/window.rs"
test = false
bench = false

# The display terminal (milestone 29's remaining increment): the component that makes the
# framebuffer readable. One binary, two wirings (rung one's display endpoint, or rung two's
# doorbell), because being a client at both seams is what proves neither contract needed to change
# to carry text. `mkinitrd` packs it as "display_terminal" for both ISAs.
[[bin]]
name = "display_terminal"
path = "src/display_terminal.rs"
test = false
bench = false

# Live component replacement (milestone 23, DECISIONS §39). Four programs, one shared module
# (src/swap.rs): `swapper` is the operator that swaps a running component under a talking client;
# `rust_swappable` and `c_swappable` are the two instances of that component (the second computes
# its answers in C, so the replacement is a different implementation in a different language);
# `chatty` is the client that keeps talking across the swap and the attacker that tries to become
# the server. Portable, both ISAs; the kernel's live_swap_tests drive them.
[[bin]]
name = "swapper"
path = "src/swapper.rs"
test = false
bench = false

[[bin]]
name = "rust_swappable"
path = "src/rust_swappable.rs"
test = false
bench = false

[[bin]]
name = "c_swappable"
path = "src/c_swappable.rs"
test = false
bench = false

[[bin]]
name = "chatty"
path = "src/chatty.rs"
test = false
bench = false

# The queue broker (milestone 23, the latency ladder's middle rung): the opt-in, per-channel
# lifecycle decoupler. A producer never blocks on an absent consumer; the broker buffers in its own
# budget and the new consumer drains the backlog in order. Never the default, because it costs an
# extra hop, which `broker_rtt` prices.
[[bin]]
name = "broker"
path = "src/broker.rs"
test = false
bench = false

# The clock service (milestone 51, DECISIONS §43): owns the RTC's registers and the wall clock's
# offset, publishes the offset into a page its readers hold read-only, and serves proposals it is
# free to refuse. Both RTC drivers ride in it, on both ISAs, because the device is a fact about the
# board rather than the instruction set. `mkinitrd` packs it as "clock" for both ISAs.
[[bin]]
name = "clock"
path = "src/clock.rs"
test = false
bench = false

# `date` (milestone 51, DECISIONS §43): reads the clock page, hands the number to the host-tested
# `calendar` crate, prints. It holds a read-only mapping and therefore cannot set the clock; there is
# no `date -s` here on purpose. `mkinitrd` packs it as "date" for both ISAs.
[[bin]]
name = "date"
path = "src/date.rs"
test = false
bench = false

# `rm` (milestone 47's rmdir lane): the first program endowed a **directory** capability, and the
# reason `rm` stopped being a shell builtin. A builtin runs with the shell's whole endowment; this
# takes an attenuated grant, so its recursion can only reach what it was handed. `mkinitrd` packs it
# as "rm" for both ISAs.
[[bin]]
name = "rm"
path = "src/rm.rs"
test = false
bench = false

# `disk_surveyor` (milestone 57): what drives are attached, and how the one it holds is divided up.
# It holds a read-only roster mapping (the listing) and a block-service endpoint (the one disk), and
# the whole point is that those are two authorities rather than one. Its second role is the negative
# control: it writes to the roster's address and dies. `mkinitrd` packs it for both ISAs.
#
# A surveyor maps land they do not own, which is the split this program exists to demonstrate.
[[bin]]
name = "disk_surveyor"
path = "src/disk_surveyor.rs"
test = false
bench = false

# `disk_partitioner` (milestone 57's write half): writes the map the surveyor reads. The pair of
# authorities it needs is the demonstration: ONE disk, and an entropy endpoint for the unique ids a
# GPT requires. Without the second it writes nothing at all rather than inventing an id, and the
# same binary's verify role reads the disk back to show which happened. `mkinitrd` packs it for both
# ISAs. Provisional name (milestone 57's lane): Chris settles program names.
[[bin]]
name = "disk_partitioner"
path = "src/disk_partitioner.rs"
test = false
bench = false

# The keyboard driver (milestone 29's input): a confined userspace virtio-input driver whose whole
# power to inject a keystroke is the mapping of the compositor's input ring, not the doorbell every
# client holds. `mkinitrd` packs it as "kbd" for both ISAs.
[[bin]]
name = "kbd"
path = "src/kbd.rs"
test = false
bench = false

# The entropy service (milestone 56, DECISIONS §44): owns a virtio-rng device and is the only thing
# that can read it; clients hold an endpoint that means "you may obtain randomness". The driver rides
# in it, the way both RTC drivers ride in the clock service, because a separate driver process would
# add a hop and hold exactly the same authority. `mkinitrd` packs it as "entropy" for both ISAs.
[[bin]]
name = "entropy"
path = "src/entropy.rs"
test = false
bench = false

# The credential service (milestone 56, the credential half): holds the credential store and serves
# one question over one endpoint. Its authority to *write* the store is a second endpoint that it
# deletes at the seal, so a client cannot be refused permission to write it; there is no object left
# for the request to travel through. `mkinitrd` packs it as "credentialer" for both ISAs.
[[bin]]
name = "credentialer"
path = "src/credentialer.rs"
test = false
bench = false

# The credential service's clients (milestone 56): the provisioner that fills the store, the honest
# client that asks questions, and the attacker that holds the identical endowment and tries to write
# it. One binary, three roles, because an attacker on the honest path is a fairer test of a boundary
# than a different program failing for its own reasons. `mkinitrd` packs it as "credentialer_test_client".
[[bin]]
name = "credentialer_test_client"
path = "src/credentialer_test_client.rs"
test = false
bench = false

# The NTP client (milestone 51): holds a network capability and the right to PROPOSE a time, and
# deliberately not the right to set one. One binary, three roles (the client, the test server that
# answers it, and the probe that proves the clock page is unreachable). `mkinitrd` packs it as "ntp"
# for both ISAs.
[[bin]]
name = "ntp"
path = "src/ntp.rs"
test = false
bench = false

# The sink contract's ends (milestone 50): a program that writes to whatever is in its output slot,
# a caretaker that puts a file behind that slot, and the read-back that proves the bytes went
# through a real filesystem. One binary, three roles. `mkinitrd` packs it as "sink" for both ISAs.
[[bin]]
name = "sink"
path = "src/sink.rs"
test = false
bench = false

# The consumer (milestone 50): counts what arrives on its input and writes the numbers to its
# output, both over the sink contract. The first program in the tree that reads a stream, and the
# right-hand side of `date | wc`. Portable, so both ISAs' archives carry it.
[[bin]]
name = "wc"
path = "src/wc.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
abi = { version = "0.1.0", path = "../crates/abi" }
c_seam = { version = "0.1.0", path = "../crates/c_seam" }
supervision_proto = { version = "0.1.0", path = "../crates/supervision_proto" }
swap_proto = { version = "0.1.0", path = "../crates/swap_proto" }
virtio = { version = "0.1.0", path = "../crates/virtio" }
socket_proto = { version = "0.1.0", path = "../crates/socket_proto" }
bitfont = { version = "0.1.0", path = "../crates/bitfont" }
block_roster = { version = "0.1.0", path = "../crates/block_roster" }
gpt = { version = "0.1.0", path = "../crates/gpt" }
calendar = { version = "0.1.0", path = "../crates/calendar" }
grant_plan = { version = "0.1.0", path = "../crates/grant_plan" }
clock_proto = { version = "0.1.0", path = "../crates/clock_proto" }
cred = { version = "0.1.0", path = "../crates/cred" }
cred_proto = { version = "0.1.0", path = "../crates/cred_proto" }
compositor = { version = "0.1.0", path = "../crates/compositor" }
coremark = { version = "0.1.0", path = "../crates/coremark" }
crickerfs = { version = "0.1.0", path = "../crates/crickerfs" }
elf = { version = "0.1.0", path = "../crates/elf" }
entropy_proto = { version = "0.1.0", path = "../crates/entropy_proto" }
fs_proto = { version = "0.1.0", path = "../crates/fs_proto" }
gfx_proto = { version = "0.1.0", path = "../crates/gfx_proto" }
line_editor = { version = "0.1.0", path = "../crates/line_editor" }
ntp_proto = { version = "0.1.0", path = "../crates/ntp_proto" }
sink_proto = { version = "0.1.0", path = "../crates/sink_proto" }
# The shell's own logic (milestone 70): the routing of a typed line, the pattern-versus-text
# question, and every sentence the prompt prints. `user/src/swish.rs` is the same program it was and
# keeps all the IO; what moved is what a host test can reach. `glob` left this manifest in the same
# change, because `has_magic` was reached only from the function that moved.
swish = { version = "0.1.0", path = "../crates/swish" }
user_rt = { version = "0.1.0", path = "../crates/user_rt" }
video_terminal = { version = "0.1.0", path = "../crates/video_terminal" }

# smoltcp (milestone 30, piece 3): the userspace TCP/IP stack. no_std, heap over user_rt's
# UntypedHeap. Pinned at 0.13.1; divergence policy is the vendored-engine discipline (DECISIONS §18).
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
] }
