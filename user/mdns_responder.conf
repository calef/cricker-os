# What this machine advertises over multicast DNS, read by `mdns_responder` (milestone 55).
#
# Every value here is MEASURED, not derived from the RFCs: it was captured from calef's working
# family Time Machine server (a GL.iNet GL-BE9300 running OpenWrt and Samba with vfs_fruit) on
# 2026-08-15, by sending one-shot PTR queries and decoding what came back. notes/mdns.md has the
# capture, the method for re-running it, and what each field turned out to mean. Where the capture
# and the documentation disagreed, the capture won; `model` below is the standing example.
#
# The format is mdns_config's: `key = value`, one `disk` line per Time Machine share, `#` comments.

# The instance name of all three advertised services, and the host part of `<host>.local`. The
# reference uses its model number.
host = GL-BE9300

# The port `_smb._tcp` advertises. 445 is SMB direct TCP; `_adisk` and `_device-info` advertise
# port 0 (they carry flags, not a service), which is measured behaviour and not configurable.
smb-port = 445

# The `_device-info._tcp` model string, which is what picks the icon macOS shows. The reference
# says MacSamba even though its own Samba config sets `fruit:model = TimeCapsule`: the two knobs
# are independent, and the working system runs with them disagreeing.
model = MacSamba

# The server-wide `sys=adVF=` value in the `_adisk._tcp` TXT record.
sys-flags = 0x100

# One line per Time Machine share, in the order they become dk0=, dk1= inside the single
# `_adisk._tcp` TXT record. ONE advertisement carries every disk; one announcement per share would
# be wrong. Two disks is the reference's truth as of 2026-08-15 (graeme moved to Windows, whose
# backups leave Time Machine entirely), and 0x82 is the adVF value a Mac was measured to accept.
disk = corinne 0x82
disk = chris 0x82
