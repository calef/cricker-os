# What this machine runs on a schedule, read by `timetable` (milestone 129).
#
# The format is `crates/timetable`'s, and it is two words wide on purpose:
#
#     every <interval>   <command>      # interval is digits and one of ms, s, m
#     at-boot            <command>      # once, when the timetable is armed
#
# `#` comments run to end of line; blank lines are ignored.
#
# THE COMMAND IS A GRANT EXPRESSION, not a shell line. It is the same text you would type at the
# prompt, and it is checked at registration by exactly the function the prompt checks it with
# (`grant_plan::plan`). So an entry cannot name authority its program's manifest does not declare,
# and it cannot be backed by authority this timetable was not itself granted. `timetable` prints
# the whole plan, per entry, BEFORE the first tick: what each scheduled child will hold, or why it
# will never run.
#
# That is the difference from a crontab, and it is the whole milestone. A crontab line runs as a
# user and can do whatever that user can do; there is nothing to print and nothing to check. Here
# whoever can edit this file can make these grants periodic, and nothing else.
#
# ---------------------------------------------------------------------------------------------
#
# HONEST NOTE ON WHAT IS SCHEDULED HERE. Nothing in this system yet has real housekeeping to do:
# milestone 55's snapshot thinning and scrub passes are the first customer and do not exist. So
# this document is a demonstration rather than a work list, and it is written to show every answer
# registration can give rather than to look plausible. The intervals are short for the same
# reason: the cross-ISA test reads this file, and a five-minute heartbeat would make it a
# five-minute test.

# ---- entries that fire ----

# The heartbeat. `worker` squares its argument and reports the answer, which makes it the smallest
# thing in the tree that proves a scheduled child really ran: 7 comes back as 49, so a fire that
# did not happen and a fire that happened wrong look different.
every 150ms  worker 7

# Once, at arming, and never again. The other half of the schedule vocabulary.
at-boot      worker 3

# ---- an entry backed by a memory grant ----

# The proof that a `--mem` grant is not just planned but actually backed: this timetable holds
# `timetable::SHIPPED_HELD.mem_pages` (4) pages it may split off for exactly this purpose, so the
# line is admitted, and it fires once, at arming, taking a real budget nested inside its own
# instance region. See `user/src/timetable.rs`'s BUGS for what backing a grant costs (at most one
# such instance may be outstanding at a time).
at-boot      budgeter --mem 4

# ---- entries the prompt's own check refuses, arriving here unchanged ----

# `budgeter` exists to spend a memory grant, so its manifest requires `--mem` and a line that names
# none is refused. This is the shell's refusal, verbatim: the same line typed at the prompt gets the
# same sentence, because it is the same check. (The line above is the same program, backed; this
# one shows what happens when the line itself forgets to ask.)
every 1s     budgeter

# `wc` reads an input stream and there is nobody behind a scheduled job to feed it. This one is
# refused by the SHELL'S check too: `grant_plan` already answers `InputRequired` for a line that
# gives a reading program nothing, so scheduling it needed no new opinion. It is here to show that
# the prompt's refusals arrive unchanged.
every 1s     wc

# ---- entries this timetable holds nothing to back ----
#
# These are the interesting ones, and they are the lines a Unix cron would simply have run.

# `date` reads the wall clock, and on this system the wall clock is a capability (DECISIONS §43).
# This timetable was granted none, so it cannot endow one, and it says so at registration instead of
# firing a program every second that can only print that it does not know what time it is.
# Note what CANNOT fix this: editing the line. The fix is granting the timetable a clock, which is a
# decision somebody makes on purpose at the spawn site.
every 1s     date

# `ps` wants a view of a supervision domain. This timetable supervises its own children and holds no
# domain capability to hand one of them, so a scheduled `ps` is refused rather than shown an empty
# list. `/proc` has no way to express the difference.
every 1s     ps
