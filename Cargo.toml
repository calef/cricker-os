[workspace]
resolver = "3"
members = [
    "kernel",
    "xtask",
    "user",
    "crates/abi",
    "crates/asid",
    "crates/caps",
    "crates/capsh",
    "crates/crickerfs",
    "crates/dma_validate",
    "crates/dtb",
    "crates/elf",
    "crates/frames",
    "crates/fs_proto",
    "crates/ipc",
    "crates/paging",
    "crates/pci",
    "crates/regions",
    "crates/intrusive",
    "crates/linedisc",
    "crates/measure",
    "crates/slots",
    "crates/uheap",
    "crates/user_rt",
    "crates/coremark",
]

# The vendored RedoxFS engine (vendor/redoxfs) and the host tool that wraps it (tools/redoxfs-host)
# are deliberately kept OUT of this workspace: each is its own workspace root (an empty [workspace]
# in its Cargo.toml) and both are excluded here. This is what keeps our `-D warnings` clippy gate
# and `cargo fmt` off upstream code we do not own, and keeps redoxfs's default features (which pull
# `fuser`, whose build script panics on macOS) out of our builds. They are still gated, just on
# their own: script/lint, script/fmt, and cargo xtask test each drive them by --manifest-path. See
# vendor/README.md. Nothing in the kernel depends on redoxfs yet; that is milestone 32 phase 2.
exclude = [
    "vendor/redoxfs",
    "tools/redoxfs-host",
]

# Shared package metadata. Each member opts in with `license.workspace = true`, so the
# dual license is declared in exactly one place. MIT OR Apache-2.0 is the Rust-ecosystem
# convention: it lets downstream users pick whichever fits their project, and the Apache
# half adds an explicit patent grant the bare MIT license lacks. See LICENSE-MIT and
# LICENSE-APACHE.
[workspace.package]
license = "MIT OR Apache-2.0"

# The measured-boot hash is compiled optimized even in a debug build (milestone 22 phase B.1). init is
# a 1.2 MB ELF and the kernel hashes it before every boot, including six times per aarch64 test run;
# an unoptimized SHA-256 makes that a visible tax under TCG for no benefit, since the crate is pure
# arithmetic with nothing a debugger would want to step through. Its correctness is pinned by host
# tests against the published FIPS vectors, so the optimized build is not less trustworthy.
[profile.dev.package.measure]
opt-level = 2

# Note: we deliberately do NOT set `panic = "abort"` here. The bare-metal target
# has abort baked in already, and setting it workspace-wide would break `cargo test`
# for the host-side crates we plan to add (DECISIONS.md §7).
