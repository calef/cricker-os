# Dependabot keeps dependencies current by opening PRs, which CI then checks. Two ecosystems:
# the Rust crates (Cargo) and the GitHub Actions the workflow pins. See
# https://docs.github.com/code-security/dependabot.
version: 2
updates:
  # --- Rust dependencies (the workspace root Cargo.toml / Cargo.lock) --------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Fold routine minor/patch bumps into a single PR so the queue stays quiet; a major bump
    # (which can break the build) still gets its own PR to review on its own.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The NTLM crypto primitives are pinned on purpose (crates/ntlm/Cargo.toml). NTLMv2 mandates MD4
    # and MD5, so nothing here *chooses* the algorithm: a major bump of these four is pure API churn
    # for zero security or behaviour gain, and worse, they are one coordinated RustCrypto release
    # (digest 0.11 pulls hmac 0.13 / md-5 0.11 / md4 0.11), so a lone major PR for any one of them
    # cannot even build. The supply-chain job (cargo-deny advisories) still watches the graph, so a
    # real advisory is not silenced by this. Minor/patch updates within the pinned majors still flow
    # through the group above. Revisit by deleting the relevant line if the crate is ever unpinned.
    ignore:
      - dependency-name: "digest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major"]
      - dependency-name: "md-5"
        update-types: ["version-update:semver-major"]
      - dependency-name: "md4"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions used by .github/workflows/ci.yml ----------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
