name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, set once for every job below. CodeQL flagged its absence
# (actions/missing-workflow-permissions, 7 alerts) and it is the right call for this repo in
# particular: a project whose entire thesis is that components should hold the authority their job
# needs and nothing more has no business letting its CI token default to write access it never uses.
# Jobs that genuinely need more say so themselves (see toolchain-bump.yml, which needs to open a PR).
permissions:
  contents: read

# On a branch or a PR, a follow-up push supersedes the in-flight run: only the tip is interesting.
#
# **On `main` it must not**, and the reason is a real failure rather than a preference. A full run
# takes around forty minutes; pushes to `main` during a working session land every fifteen. With
# `cancel-in-progress` unconditional, every run was killed by the next push before it finished --
# ten of twelve consecutive runs ended `cancelled`, so **CI verified nothing on `main` for ten
# pushes** while the badge reported the newest completed run, which was a cancellation.
#
# That is the bad kind of failure: it looks like a red badge (cosmetic, ignorable) and it is
# actually the absence of the signal the badge exists to carry. Every commit that reaches `main`
# gets a complete run, even if several queue up behind each other.
# The mechanism is the GROUP, not the flag, and getting that wrong cost a second attempt.
# `cancel-in-progress: false` protects only the run that is already executing; GitHub still cancels
# any *pending* run in the group when a newer one queues. With ~40-minute runs and pushes every few
# minutes, that left the in-progress run and the newest queued one alive and killed everything
# between, which is most of them. Ten consecutive cancellations survived the first fix unchanged.
#
# So `main` commits are not grouped with each other at all: the SHA is in the group name, making each
# one unique and therefore uncancellable. Branches and PRs keep the shared group, where superseding
# is right because only the tip matters.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each job's real work is a script from script/ (the "Scripts to Rule Them All" set), so CI runs
# exactly what a developer runs locally. See notes/scripts.md.
#
# Every job runs on ubuntu-24.04-arm (a free aarch64 runner for public repos), not the x86_64
# ubuntu-latest default, and that is deliberate. cricker-os targets aarch64; the host-logic crates
# (paging, elf, frames, slab, the intrusive queue) run on the host in tests and on aarch64 on real
# hardware. aarch64 is weakly ordered where x86_64 is TSO, so any accidental reliance on strong
# ordering (a missing Acquire/Release, an assumed store-store order) passes on an x86_64 host and
# only fails on real aarch64. Testing on aarch64 is the one place CI catches that class, which is
# exactly the weak-ordering discipline DECISIONS.md rule 4 commits us to. It also makes CI match the
# aarch64 dev machine, so "passes locally" means "passes in CI".
jobs:
  test:
    name: build + test (host + QEMU)
    runs-on: ubuntu-24.04-arm
    # A hung kernel means QEMU never exits and the runner would block until the 6-hour default.
    # Fail loudly instead. Local runs finish in well under a minute once built.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b) arrived later, so the runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu ARM runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@v4
        with:
          path: ~/.cache/cricker-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/cricker-qemu/bin" >> "$GITHUB_PATH"

      # script/ci-build bootstraps the toolchain and QEMU (the same script/bootstrap a developer
      # runs), then runs the host-logic crates and the kernel under QEMU (TCG), exiting through
      # semihosting.
      - run: script/ci-build

  cpu-matrix:
    name: cpu matrix (riscv64 across QEMU CPU models)
    runs-on: ubuntu-24.04-arm
    # Five QEMU boots plus a std-farm build. Generous because a hung guest must fail loudly rather
    # than sit on the runner's 6-hour default, the same reason the test job has one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The same cached QEMU the test and bench jobs use, restored before script/bootstrap for the
      # same reason (bootstrap skips its apt install when QEMU is already on PATH).
      - name: Cache QEMU
        uses: actions/cache@v4
        with:
          path: ~/.cache/cricker-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/cricker-qemu/bin" >> "$GITHUB_PATH"

      # A JOB OF ITS OWN, not extra work inside `test`, and the reason is wall clock: the matrix is
      # the same riscv64 suite five times over, so folding it into the gate would make every run four
      # times longer for a check whose whole point is that it rarely changes anything. On its own
      # runner it costs nothing a developer waits for.
      #
      # On every push and pull request rather than nightly, because the change that breaks this is a
      # change to kernel/src/arch/riscv64/, which arrives in a pull request, and a nightly would
      # report the failure a day after the merge that caused it.
      #
      # See notes/cpu-models.md, including its BUGS section: a narrower QEMU model is still QEMU.
      - run: script/bootstrap
      - run: script/cpu-matrix
      # The per-model logs, kept only when something failed. `script/cpu-matrix` now prints an
      # excerpt inline, which answers most questions without leaving the browser; this is for the
      # ones it does not, because the full boot log is thousands of lines and belongs in a download
      # rather than in the job output. Without it the evidence lives only on a runner that is about
      # to be destroyed, which on 2026-08-02 forced a local re-run to read a file CI had already
      # written.
      - name: Upload the per-model logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-matrix-logs
          path: target/cpu-matrix/

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt (pinned nightly)
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: script/fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install clippy and the bare-metal target
        run: |
          rustup toolchain install nightly --profile minimal --component clippy
          rustup target add --toolchain nightly aarch64-unknown-none-softfloat
      # `script/lint` clippies the `user` package, whose build.rs compiles the C component with a
      # bare-metal clang (milestone 36, DECISIONS §30). The test job gets this from script/bootstrap;
      # this job does not run bootstrap (it would install QEMU it never uses), so install clang here.
      # Ubuntu's clang carries every LLVM backend, including RISC-V.
      # shellcheck too: script/lint gates the 23 `#!/bin/sh` scripts on it. Installed explicitly
      # rather than relying on the runner image shipping it, so the gate cannot quietly vanish when
      # that image changes.
      - name: Install clang (the C component's compiler) and shellcheck
        run: sudo apt-get update && sudo apt-get install -y clang shellcheck
      - uses: Swatinem/rust-cache@v2
      - run: script/lint

  verify:
    name: verify (Kani proofs)
    runs-on: ubuntu-24.04-arm
    # Kani pulls its own toolchain and a CBMC backend, so this is the slowest job. 106 harnesses
    # across 19 crates as of 2026-07-31, counted from the merged tree rather than from a lane. Its own job on its own runner, so its wall clock delays
    # nothing else; the 60-minute budget is the number that matters, not the minutes it adds.
    timeout-minutes: 60
    steps:
      # Full history, because the skip decision below diffs against the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **Skip the proving when the change provably cannot reach a proof.**
      #
      # Measured 2026-08-02: this job is 43 minutes, of which 42 are `script/verify`; every other
      # job in this workflow finishes inside 8. Installing Kani is 10 seconds because rust-cache
      # already holds it, so there is nothing to win in setup. The only lever is not running it.
      #
      # The rule is an ALLOW-list of things that cannot matter, not a deny-list of things that can,
      # because the failure modes are not symmetric. Skipping a proof that was needed is a broken
      # `main`; running one that was not is 42 wasted minutes. So anything not listed here runs the
      # proofs, and a new directory is covered by default.
      #
      # **The job still runs and still reports success**, and that is deliberate rather than
      # incidental. A required check that never reports blocks the merge forever, which
      # notes/repo-hardening.md names as the single most likely way to get this wrong. Skipping the
      # STEP keeps the check green; skipping the JOB would have been a coin flip on how GitHub
      # treats a skipped required check.
      - name: Does this change need the proofs?
        id: scope
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Everything a proof cannot see: prose, and the roadmap. Note `script/` is NOT here,
          # because script/verify decides which harnesses run.
          if [ -z "$(printf '%s\n' "$changed" | grep -vE '^(notes/|design/|[A-Z_]+\.md$)' || true)" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "==> documentation only; the proofs cannot be affected"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.needed == 'true'
      # Kani is deliberately NOT in script/bootstrap (it pulls its own nightly and CBMC, which the
      # test job would pay for and never use), so install it here, in the one job that needs it.
      - name: Install Kani
        if: steps.scope.outputs.needed == 'true'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # The proofs ARE the thesis (DECISIONS §14). Before 2026-07-30 they ran only on a developer's
      # machine, which meant a change could break a proof and CI would report success.
      - name: script/verify
        if: steps.scope.outputs.needed == 'true'
        run: script/verify

  bench:
    name: bench (icount regression tripwire)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Milestone 21's stated requirement is to catch "the *introduction* of performance problems
      # proximate to the changes that introduce them", and a tripwire that only fires on a
      # developer's laptop cannot do that. icount was chosen for determinism precisely so this is
      # possible: it counts guest instructions, not wall time, so a shared runner's noise does not
      # move it.
      #
      # If CI's counts and bench/baseline.txt disagree by more than the 10% tolerance, the fix is a
      # CI-specific baseline, NOT a wider tolerance: widening it to make the job green would delete
      # the only thing the job does. The baseline was committed from an aarch64 macOS host against
      # Homebrew's QEMU, and this runs aarch64 Linux against Ubuntu's, so some drift is expected and
      # the first red run is data rather than a defect.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b) arrived later, so the runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu ARM runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@v4
        with:
          path: ~/.cache/cricker-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/cricker-qemu/bin" >> "$GITHUB_PATH"

      - run: script/bootstrap
      - run: script/bench --check
      - run: script/bench --riscv --check

  supply-chain:
    name: supply chain (advisories, licences, vendored integrity)
    runs-on: ubuntu-24.04-arm
    # No permissions block of its own: the workflow-level `contents: read` above already gives every
    # job the least privilege that works, and this job wants exactly that (read the source, read the
    # advisory database, fetch a tarball from crates.io). Adding a redundant per-job copy would make
    # the workflow-level grant look like a default rather than the decision it is.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary rather than `cargo install`, the same trade the coverage job makes: this
      # job compiles nothing of ours, so it has no business compiling a tool either. The version
      # comes from .cargo-deny-version so this and script/supply-chain cannot disagree, which they
      # did on the first run: the laptop had 0.19.1 and `@latest` here got 0.20.2, and the two spell
      # `--config` differently and default it to different directories.
      - name: Read the pinned cargo-deny version
        id: deny
        run: echo "version=$(cat .cargo-deny-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ steps.deny.outputs.version }}
      # The published .crate tarballs script/vendor-verify hashes. Keyed on the pin files, so
      # changing a pin correctly misses the cache and refetches. A miss costs one HTTP request.
      - name: Cache the vendored tarballs
        uses: actions/cache@v4
        with:
          path: ~/.cache/cricker-vendor
          key: cricker-vendor-${{ hashFiles('vendor/*.pin') }}
      - uses: Swatinem/rust-cache@v2
      - run: script/supply-chain

  coverage:
    name: coverage (host crates)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install llvm-tools (pinned nightly)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Measures the pure-logic host crates only; the kernel/user crates run under QEMU, out of
      # reach of host instrumentation. Gates on the 80%-per-file line-coverage floor (the floor
      # lives in script/coverage, next to the check itself); the report is still published below.
      - run: script/coverage
      - name: Publish the summary to the run
        run: |
          {
            echo '### Coverage: host-logic crates'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the lcov + HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/
