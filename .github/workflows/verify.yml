# Kani proofs, deliberately in their OWN workflow rather than as a job in ci.yml.
#
# Not organisation: GitHub will not let you re-run a failed job while any job in the SAME workflow is
# still running. Kani takes ~47 minutes and `build + test` takes ~3, so a flaky `build + test` could
# not be retried until Kani finished, and on 2026-08-03 that turned several three-minute retries into
# forty-minute waits. Splitting the slowest job out means every other job can be retried the moment it
# fails.
#
# The check NAME is unchanged (`verify (Kani proofs)`), because that is the string the repository
# ruleset requires. Moving a job between workflows keeps its name, so the required check keeps
# matching; renaming it here would silently stop satisfying the rule.
#
# The triggers must mirror ci.yml exactly, or a pull request gets no verify check at all and blocks
# forever on a rule nothing can satisfy.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Mirrors ci.yml's group, and must: without it, splitting this job out would have QUIETLY CHANGED
# behaviour. `ci.yml` cancels an in-flight run when a branch is pushed again, so the old Kani run
# died with it. A separate workflow with no group would keep running against the superseded commit,
# burning a runner for ~47 minutes on a SHA nobody will merge, and reporting a check against it.
#
# The group name differs from ci.yml's on purpose. Sharing one would make a push cancel the OTHER
# workflow too, which is the coupling this split exists to remove.
concurrency:
  group: verify-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (Kani proofs)
    runs-on: ubuntu-24.04-arm
    # Kani pulls its own toolchain and a CBMC backend, so this is the slowest thing CI runs: ~47
    # minutes against `build + test`'s ~3. 106 harnesses across 19 crates as of 2026-07-31, counted
    # from the merged tree rather than from a lane. The 60-minute budget is the number that matters.
    timeout-minutes: 60
    steps:
      # Full history, because the skip decision below diffs against the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **Skip the proving when the change provably cannot reach a proof.**
      #
      # Measured 2026-08-02: this job is 43 minutes, of which 42 are `script/verify`; every other
      # job in this workflow finishes inside 8. Installing Kani is 10 seconds because rust-cache
      # already holds it, so there is nothing to win in setup. The only lever is not running it.
      #
      # The rule is an ALLOW-list of things that cannot matter, not a deny-list of things that can,
      # because the failure modes are not symmetric. Skipping a proof that was needed is a broken
      # `main`; running one that was not is 42 wasted minutes. So anything not listed here runs the
      # proofs, and a new directory is covered by default.
      #
      # **The job still runs and still reports success**, and that is deliberate rather than
      # incidental. A required check that never reports blocks the merge forever, which
      # notes/repo-hardening.md names as the single most likely way to get this wrong. Skipping the
      # STEP keeps the check green; skipping the JOB would have been a coin flip on how GitHub
      # treats a skipped required check.
      # The decision is computed by `script/verify --affected-since`, not by a path list here,
      # so it lives where a developer can run it (notes/scripts.md: a command living only in YAML
      # has no witness). The proofs are a function of the harness crates and their transitive
      # dependencies; the script asks cargo for that closure and skips only when every changed
      # file is provably outside it (docs, workflow files other than this one, or crates like
      # `kernel` and `user` that no proof ever compiles). Anything it cannot attribute runs the
      # proofs by default. Note: on non-doc changes the script invokes `cargo metadata`, which
      # installs the pinned toolchain; a minute spent deciding is fine against the 42 it can save,
      # and doc-only changes never reach cargo.
      - name: Does this change need the proofs?
        id: scope
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          scope="$(script/verify --affected-since "$base")"
          echo "$scope"
          if [ "$(echo "$scope" | tail -1)" = "verify-scope: not-needed" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "==> nothing in this change can reach a proof"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.needed == 'true'
      # Kani is deliberately NOT in script/bootstrap (it pulls its own nightly and CBMC, which the
      # test job would pay for and never use), so install it here, in the one job that needs it.
      - name: Install Kani
        if: steps.scope.outputs.needed == 'true'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # The proofs ARE the thesis (DECISIONS §14). Before 2026-07-30 they ran only on a developer's
      # machine, which meant a change could break a proof and CI would report success.
      - name: script/verify
        if: steps.scope.outputs.needed == 'true'
        run: script/verify

