# Name: unrecorded, and it is a convention rather than a choice. `xtask` is the established Rust
# pattern for a build-automation binary in its own package (matklad's, widely adopted), so this is the
# protected class again: a stranger who has met `cargo xtask` anywhere else has met it here. Renaming
# it would assert novelty where there is none, which is the same argument §50's `bind` records.

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
nifefs = { version = "0.1.0", path = "../crates/nifefs" }
# The documentation store (milestone 40). The index is built HERE, on a host with a heap and no
# constraints, because the guest has neither: there is no directory iteration in this system, so
# "what pages exist" cannot be discovered at runtime and has to be computed at image time. Only the
# writer is behind the `builder` feature; the reader that runs confined allocates nothing.
manual = { version = "0.1.0", path = "../crates/manual", features = ["builder"] }
fs_proto = { version = "0.1.0", path = "../crates/fs_proto" }
# The partition table (milestone 57's write half): the post-run check reads the table the GUEST
# wrote, from outside the guest, with the same parser the guest used and the same one whose host
# tests run against tables `sgdisk` and macOS `diskutil` wrote. It also slices the data partition out
# of the image so the host tool can open the filesystem inside it.
gpt = { version = "0.1.0", path = "../crates/gpt" }
# The measured-boot hash (milestone 22 phase B.1): the build and the kernel measure init through the
# same implementation, so there is one definition of the digest.
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }
# The framebuffer contract (milestone 29): the host-side scanout check compares QEMU's screendump
# against the same pattern the guest painted, from the same definition, so the two cannot drift.
gfx_proto = { version = "0.1.0", path = "../crates/gfx_proto" }
smb_proto = { version = "0.1.0", path = "../crates/smb_proto" }
# NTLMv2's arithmetic (milestone 54's identity item). The prober is a *client*, so it legitimately
# knows the password and computes a real proof over the challenge the guest issued; the guest's own
# SMB adapter cannot, because `smb_proto` takes `ntlm` only as a dev-dependency. This crate being a
# real dependency here and a dev-dependency there is the whole shape of the claim: the client holds
# the secret, the server holds an endpoint.
ntlm = { version = "0.1.0", path = "../crates/ntlm" }
# The credential contract (milestone 65), for its `fixture` module only: the account the guest's
# store is provisioned with, so this prober and the provisioning role agree on it down to the byte.
cred_proto = { version = "0.1.0", path = "../crates/cred_proto" }
# The mDNS responder's configuration document (milestone 55). The gate's expectations are DERIVED
# from the same file the guest ships, so editing what this machine advertises moves the assertion
# with it and the two cannot drift. The wire-format side is deliberately NOT shared: the prober
# decodes the guest's answers with its own parser below, or the gate would be checking mdns_proto
# against itself.
mdns_config = { version = "0.1.0", path = "../crates/mdns_config" }
# The compositor contract (milestone 33): the same scanout check also verifies the screen the
# compositor composed, against the same scene and the same per-pixel definition the guest used. A
# compositor's output is the thing a guest-side digest cannot confirm on its own.
compositor = { version = "0.1.0", path = "../crates/compositor" }
# The VT engine (milestone 29's text increment): the host-side scanout check runs the same engine
# over the same script the guest's terminal was sent, so "readable text reached the device" is a
# pixel-for-pixel claim rather than an impression. Text is the case where eyeballing is most
# tempting and least sufficient.
video_terminal = { version = "0.1.0", path = "../crates/video_terminal" }
