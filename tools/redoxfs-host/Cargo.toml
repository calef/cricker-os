# Its own workspace root, deliberately NOT a member of the cricker-os workspace. It depends on the
# vendored redoxfs (also its own workspace), and cargo forbids a member of one workspace from
# depending on an in-tree crate that another workspace owns ("multiple workspace roots"). Keeping
# this tool and the engine it wraps in their own workspaces is also what stops our `-D warnings`
# clippy gate and `cargo fmt` from reaching upstream code we do not own. This tool is gated on its
# own: script/lint, script/fmt, and cargo xtask test each invoke it by --manifest-path. See
# vendor/README.md.
[workspace]

[package]
name = "redoxfs-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Unpublishable by construction: it depends on ../../vendor/redoxfs by path, and crates.io forbids
# path dependencies. Saying so is what lets cargo-deny's wildcard ban (deny.toml) tell an in-tree
# path dep apart from a registry `version = "*"`.
publish = false

# Host-side RedoxFS image tooling (milestone 32, roadmap §32 port plan item 4): mkfs and
# inspection stay on the host, where std, getrandom, and uuid are honest dependencies; the
# cricker-os FS server only ever OPENS an existing image. `std` but deliberately NOT `fuse`:
# creation and inspection need no mounted filesystem, so no macFUSE requirement rides along.
[dependencies]
redoxfs = { path = "../../vendor/redoxfs", default-features = false, features = ["std"] }
