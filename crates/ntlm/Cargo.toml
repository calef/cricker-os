[package]
name = "ntlm"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
# **Three known-broken primitives, on purpose** (milestone 65; design/roadmap/56-secrets-and-entropy.md).
# NTLMv2 specifies MD4 and MD5 and nothing chooses them here: shipping them is protocol
# compliance, the way implementing DES to talk to old hardware would be. DECISIONS §46's rule
# applies unchanged (depend, do not vendor, so cargo-deny and cargo-audit can see the graph), and
# so does its discipline: the specification's own test vectors are this crate's tests.
md4 = { version = "0.10", default-features = false }
md-5 = { version = "0.11", default-features = false }
hmac = { version = "0.12", default-features = false }
digest = { version = "0.10", default-features = false }

# cargo-machete (script/lint) reports `md-5` unused here and is wrong, the same way it is wrong
# about `redox_syscall` in fs_server: the crate's LIB name is `md5` and its PACKAGE name is `md-5`,
# so a source grep for the package name finds nothing. `use md5::Md5;` is the only spelling that
# compiles. The dependency is load-bearing; MD5 is half of HMAC-MD5, which is every operation in
# this crate except the NT hash.
[package.metadata.cargo-machete]
ignored = ["md-5"]
