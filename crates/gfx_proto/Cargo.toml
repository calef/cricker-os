[package]
name = "gfx_proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The framebuffer contract of milestone 29 (notes/framebuffer-contract.md): the geometry and pixel
# format of a shared frame, the small control protocol a client speaks to the display driver, and
# the test pattern plus its checksum. Pure logic, host-tested, no_std, so the driver, the client,
# and the kernel-side test share ONE definition and cannot drift. The same split `fs_proto` makes
# for the filesystem contract and `lineedit::proto` for the terminal's.

