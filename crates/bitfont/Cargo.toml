[package]
name = "bitfont"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The font half of milestone 29's remaining increment (notes/glyphs.md): an 8x8 monochrome bitmap
# font and the pure function that turns a character cell into pixels. Glyph rasterisation is
# arithmetic over a constant table, so it belongs in a crate whose tests run in milliseconds rather
# than in an emulator; the terminal component, the kernel-side test, and the host-side scanout check
# then all draw text from ONE definition and cannot disagree about what a letter looks like.
#
# The glyph data itself is public domain (font8x8 by Daniel Hepper, from Marcel Sondaar's, from IBM's
# public-domain VGA fonts). See src/glyphs.rs for the provenance and why a public-domain font was the
# right pick for bits that get compiled into every image.

