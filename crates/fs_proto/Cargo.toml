[package]
name = "fs_proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The wire protocols of milestone 32's filesystem stack: the block-IPC protocol (FS server <-> block
# server) and the file-service protocol (client <-> FS server). Pure logic, host-tested, no_std, no
# dependency on redoxfs or the kernel: the constants and packers live in ONE place so the block
# server, the FS server, the client, and the kernel-side tests cannot drift. This mirrors how
# `lineedit::proto` holds the terminal contract's framing (notes/terminal-contract.md). The written
# contract is notes/fs-server.md; this crate is its code.

# `kani` is set only by `cargo kani` (script/verify), never by an ordinary build. Declaring it here
# keeps unexpected_cfgs from flagging the `#[cfg(kani)]` proof module under -D warnings. The property
# it proves is milestone 47's: a directory capability's child can never carry a right the parent
# lacked, for every mask rather than for the ones a test thought of.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
