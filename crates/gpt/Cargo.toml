[package]
name = "gpt"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The GUID Partition Table (UEFI 2.10 §5.3), as pure computation: parse a table, validate one,
# build one. No I/O of any kind, so it compiles for the host and its tests run in milliseconds
# against disks made by real tools (`sgdisk` and macOS's `diskutil`, both committed as fixtures),
# the same split `dtb` makes for the device tree. Milestone 57's mandatory half: you cannot find a
# partition on a real disk without reading the table. See notes/gpt.md.

