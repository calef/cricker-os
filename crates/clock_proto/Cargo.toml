[package]
name = "clock_proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The wall-clock contract of milestone 51 (notes/clock.md, DECISIONS §43): the layout of the shared
# clock page that IS the read authority, the small propose protocol the clock service serves, and
# the policy it applies to a proposal. Pure logic, host-tested, no_std, dependency-free, so the
# service, its readers, the std PAL and the kernel-side tests share ONE definition and cannot drift.
# The same split `fs_proto` makes for the filesystem contract and `gfx_proto` for the framebuffer.

[lints]
workspace = true

[dependencies]

# Loom, only under `--cfg loom`, which nothing but `script/interleaving-check` sets. Cargo evaluates
# `cfg(loom)` as false for every real target, so no ordinary build resolves or compiles it. The
# seqlock above is the second protocol milestone 80 modelled; see notes/interleaving.md for what the
# retrofit cost, which was the milestone's actual question.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
